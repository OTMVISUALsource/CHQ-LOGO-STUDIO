<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHQ Logo Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#121214;--pn:#1e1e21;--ln:#34363b;--fg:#f4f5f7;--mu:#9ca3af;--ac:#2f74e6;--ok:#5bd28c;--rv:#f0a04b;--no:#8a94a3}
*{box-sizing:border-box}
html{min-height:100%;background:linear-gradient(104deg,#2d78ea 0%,#15439b 8%,#2e2e30 8.2%,#1b1b1d 50%,#2e2e30 91.8%,#15439b 92%,#2d78ea 100%) fixed}
body{margin:0;color:var(--fg);font:15px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;padding:20px 16px 60px;max-width:1080px;margin-inline:auto}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.orb{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#2c2c2f,#000 70%);box-shadow:0 6px 18px #0009,inset 0 0 0 1px #ffffff14;font:900 21px/1 "Arial Black",Impact,sans-serif;color:#fff;text-shadow:0 2px 3px #000}
h1{font:800 28px/1.1 "Avenir Next","Segoe UI",system-ui,sans-serif;margin:0}
.sub{color:#c3c8d0;margin:0 0 20px}
.box{background:#1e1e21f2;border:1px solid var(--ln);border-radius:10px;padding:14px}
textarea{width:100%;height:150px;resize:vertical;background:var(--bg);color:var(--fg);border:1px dashed var(--ln);border-radius:8px;padding:12px;font:inherit}
textarea:focus{outline:2px solid var(--ac);border-style:solid}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
button,select,.fb{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px 14px;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--ac)}
.go{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.sp{flex:1}
#st{color:#fff;text-shadow:0 1px 3px #0008;margin:14px 2px;min-height:22px}
#done{margin-bottom:14px}#done a{text-decoration:none;display:inline-flex}#done details{margin-top:10px}#done summary{cursor:pointer}
#bar{display:none;margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:99px;font-size:13px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.c{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.lg{aspect-ratio:1/2;display:flex;align-items:center;justify-content:center;background:#fff1;border-radius:6px}
.lg img{max-width:84%;max-height:92%;object-fit:contain}
.n{font-weight:600;font-size:13px;word-break:break-word}
.m{font-size:12px;color:var(--mu);word-break:break-word}
.k-ok{color:var(--ok)}.k-review{color:var(--rv)}.k-none{color:var(--no)}
.opts{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.op{flex:0 0 auto;width:56px;padding:3px;border-radius:6px;font-size:10px;line-height:1.2;text-align:center;color:var(--mu)}.op img{width:100%;height:52px;object-fit:contain;background:#fff1;border-radius:4px;display:block}.op.on{border-color:var(--ac);outline:2px solid var(--ac)}
.c select{padding:6px;font-size:12px;width:100%}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-right:8px;flex:none}
button,.fb{display:inline-flex;align-items:center}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;justify-content:center;padding:12px}
.tab span{margin-left:8px;padding:1px 9px;border-radius:99px;background:#ffffff22;font-size:12px}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.tip{grid-column:1/-1;margin:0;padding:12px 14px;display:flex;align-items:center;background:#1e1e21f2;border:1px solid var(--ln);border-radius:10px;color:#dfe5ee}
.m{display:flex;align-items:flex-start}.m .ic{width:14px;height:14px;margin-right:5px;margin-top:2px}
.lg.empty{border:1.5px dashed #4a4f58;flex-direction:column;gap:8px;color:var(--mu);font-size:11px;text-align:center;padding:6px}
.lg.empty .ic{width:30px;height:30px;margin:0;stroke-width:1.4}
.c.drag{outline:2px solid var(--ac);background:#2f74e61f}
.upb{width:100%;justify-content:center;padding:8px;font-size:13px;border-color:var(--ac);color:#d4e3ff}
.upb .ic{width:16px;height:16px;margin-right:6px}
.rm{background:none;border:0;color:var(--mu);font-size:12px;padding:2px;justify-content:center}
.rm .ic{width:14px;height:14px;margin-right:4px}
.lg img{transform-origin:center}
.stat{flex-direction:column;align-items:stretch!important;gap:10px}
.nums{display:flex;gap:18px;flex-wrap:wrap;color:var(--mu)}.nums b{font-size:22px;color:#fff;margin-right:4px}
.pbar{height:8px;background:#ffffff22;border-radius:8px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.subs{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.sb{padding:9px 14px}.sb span{margin-left:8px;padding:1px 9px;border-radius:99px;background:#ffffff22;font-size:12px}
.sb.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.col{flex-direction:column;align-items:stretch!important;gap:10px}.col p{margin:0;color:var(--mu)}
.srow{display:flex;align-items:center;gap:8px}.srow input[type=range]{flex:1;min-width:0;accent-color:var(--ac)}.srow span{min-width:42px;text-align:right;font-size:13px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.tab{padding:11px 6px!important;font-size:13px}.tab .ic{margin-right:5px}
.acc{width:100%;justify-content:center;padding:9px;font-size:13px;font-weight:700;background:#16a34a;border-color:#16a34a;color:#fff}
.acc .ic{width:17px;height:17px;margin-right:6px;stroke-width:2.2}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3h7l5 5v12a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="17" cy="6" r="2.5"/><circle cx="17" cy="18" r="2.5"/><path d="M8.2 10.8l6.6-3.6M8.2 13.2l6.6 3.6"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 3.5 3 3-2.5 4.5 4"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></symbol>
<symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 15.5H3L12 4z"/><path d="M12 10v4.2M12 17v.2"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9 9l6 6M15 9l-6 6"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.2"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 12h8l1-12"/></symbol>
</defs></svg>
<input id="upf" type="file" accept="image/*" hidden>
<div class="brand"><span class="orb" aria-hidden="true">CHQ</span><h1>Logo Studio</h1></div>
<p class="sub">Drop your channel list. Get every matching logo in one ZIP, already sized.</p>

<div class="box">
<textarea id="in" placeholder="Paste your channels here, one per line or separated by commas&#10;&#10;ESPN USA, Sky Sports Main Event UK, Canal+ Sport France, TF1 France"></textarea>
<div class="row">
<button class="go" id="run"><svg class="ic"><use href="#i-search"/></svg>Find logos</button>
<label class="fb"><svg class="ic"><use href="#i-file"/></svg>Load playlist (.m3u)<input id="f" type="file" accept=".m3u,.m3u8,.txt" hidden></label>
</div>
</div>
<div id="st"></div>
<div id="done"></div>

<div id="bar" class="box">
<div class="tabs" id="tabs"></div>
<div class="row" style="margin-top:0">
<div class="chips" id="chips"></div><span class="sp"></span>
<select id="sz" aria-label="Image size"><option value="150x300">150 × 300</option><option value="300x600" selected>300 × 600</option><option value="450x900">450 × 900</option><option value="600x1200">600 × 1200</option></select>
<label class="fb"><input type="checkbox" id="bg"> White background</label>
<button class="fb" id="deep"><svg class="ic"><use href="#i-search"/></svg>Deep search missing</button>
<button class="go" id="zip"><svg class="ic"><use href="#i-down"/></svg>Download ZIP</button>
</div>
</div>
<div id="grid"></div>

<script>
const IPTV='https://iptv-org.github.io/api/',TVL='https://data.jsdelivr.com/v1/package/gh/tv-logo/tv-logos@main/flat',TVLC='https://cdn.jsdelivr.net/gh/tv-logo/tv-logos@main';
const CN={us:'US',usa:'US','united states':'US',america:'US',uk:'GB',gb:'GB','united kingdom':'GB',fr:'FR',france:'FR',de:'DE',germany:'DE',it:'IT',italy:'IT',es:'ES',spain:'ES',pt:'PT',portugal:'PT',pl:'PL',poland:'PL',nl:'NL',netherland:'NL',netherlands:'NL',dk:'DK',denmark:'DK',se:'SE',sw:'SE',sweden:'SE',norway:'NO',tr:'TR',turkey:'TR',gr:'GR',greece:'GR',cy:'CY',cyprus:'CY',il:'IL',israel:'IL',ru:'RU',russia:'RU',rs:'RS',serbia:'RS',hr:'HR',croatia:'HR',bg:'BG',bulgaria:'BG',ro:'RO',romania:'RO',cz:'CZ','czech republic':'CZ',czechia:'CZ',sk:'SK',slovakia:'SK',ca:'CA',canada:'CA',mx:'MX',mexico:'MX',br:'BR',brasil:'BR',brazil:'BR',ar:'AR',argentina:'AR',ae:'AE',uae:'AE','united arab emirates':'AE',qa:'QA',qatar:'QA',au:'AU',australia:'AU',nz:'NZ','new zealand':'NZ',in:'IN',india:'IN',pk:'PK',bd:'BD',hu:'HU',hungary:'HU',ie:'IE',ireland:'IE',bih:'BA',ba:'BA',malaysia:'MY',cl:'CL',chile:'CL',uy:'UY',uruguay:'UY',columbia:'CO',colombia:'CO',austria:'AT',switzerland:'CH',belgium:'BE','south africa':'ZA'};
const NOISE=new Set(['hd','fhd','uhd','sd','channel','the']);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isNum=x=>/^\d+$/.test(x);
let DB=null,TOK={},R=[],flt='all';

function P(raw,hint){
 const orig=raw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,' and ').replace(/\+/g,' plus ').replace(/([a-z])(\d)/g,'$1 $2').replace(/(\d)([a-z])/g,'$1 $2').split(/[^a-z0-9]+/).filter(Boolean);
 let t=orig.slice(),cc=hint||null;
 if(t.length>1){
  const l2=t.slice(-2).join(' '),l1=t[t.length-1];
  if(t.length>2&&CN[l2]){cc=cc||CN[l2];t=t.slice(0,-2)}else if(CN[l1]){cc=cc||CN[l1];t=t.slice(0,-1)}
 }
 const f=t.filter(x=>!NOISE.has(x));
 return{t:f.length?f:t,cc};
}
function score(q,c){
 const cs=new Set(c.t);let sh=0;for(const x of q.t)if(cs.has(x))sh++;
 let s=2*sh/((q.t.length+c.t.length)||1);
 if(q.t.filter(isNum).join()!==c.t.filter(isNum).join())s*=.35;
 if(q.cc&&c.cc)s=q.cc===c.cc?Math.min(1,s+.12):s*.55;
 return s;
}
async function loadDB(){
 if(DB)return;
 $('st').textContent='Loading logo libraries…';
 const j=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
 const [a,b,c]=await Promise.allSettled([j(IPTV+'channels.json'),j(IPTV+'logos.json'),j(TVL)]);
 DB=[];const add=(n,disp,cc,u,s)=>{const p=P(n,cc);if(p.t.length)DB.push({n:disp,t:p.t,cc:p.cc,u,s})};
 let ok=[];
 if(a.status==='fulfilled'&&b.status==='fulfilled'){
  const best={};b.value.forEach(l=>{const ar=(l.width||0)*(l.height||0);if(!best[l.channel]||ar>best[l.channel].ar)best[l.channel]={u:l.url,ar}});
  a.value.forEach(x=>{if(x.closed)return;const u=best[x.id]?best[x.id].u:x.logo;if(!u)return;add(x.name,x.name,x.country,u,'iptv-org');(x.alt_names||[]).forEach(n=>add(n,x.name,x.country,u,'iptv-org'))});
  ok.push('iptv-org');
 }
 if(c.status==='fulfilled'){
  (c.value.files||[]).forEach(f=>{
   if(!/^\/(countries|misc)\//i.test(f.name)||!/\.(png|svg)$/i.test(f.name))return;
   const seg=f.name.split('/'),file=seg[seg.length-1].replace(/\.(png|svg)$/i,''),fold=seg[1]==='countries'?seg[2].replace(/-/g,' '):'';
   const nm=file.replace(/-/g,' ').replace(/\s(19|20)\d\d$/,'');
   add(nm,nm.replace(/\b\w/g,m=>m.toUpperCase()),CN[fold]||null,TVLC+f.name,'tv-logos');
  });
  ok.push('tv-logos');
 }
 if(!ok.length)throw new Error('No logo library could be reached. Open this file in a browser with internet access.');
 DB.forEach(c=>c.t.forEach(x=>(TOK[x]=TOK[x]||[]).push(c)));
 $('st').textContent='Libraries ready: '+ok.join(' + ')+' ('+DB.length.toLocaleString()+' logo names).';
}
function find(q,min,max){min=min||.3;max=max||5;
 if(!q.t.length)return[];
 let cand=new Set(),small=q.t.filter(x=>TOK[x]&&TOK[x].length<5000);
 (small.length?small:q.t.filter(x=>TOK[x])).forEach(x=>TOK[x].forEach(c=>cand.add(c)));
 const sc=[];cand.forEach(c=>{const s=score(q,c);if(s>=min)sc.push({c,s})});
 sc.sort((a,b)=>b.s-a.s);
 const seen=new Set(),out=[];
 for(const o of sc){if(seen.has(o.c.u))continue;seen.add(o.c.u);out.push(o);if(out.length>=max)break}
 return out;
}
function parseList(txt){
 let items=[];
 const mk=(name,logo)=>({name,logo:logo||'',q:name.replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim()||name});
 if(txt.includes('#EXTINF')){
  txt.split('\n').filter(l=>l.startsWith('#EXTINF')).forEach(l=>{const n=l.slice(l.lastIndexOf(',')+1).trim();if(n)items.push(mk(n,(l.match(/tvg-logo="([^"]*)"/)||[])[1]))});
 }else{
  const parts=[];
  txt.split(/\n+/).forEach(l=>{let d=0,c='';for(const ch of l){if(ch==='(')d++;if(ch===')')d=Math.max(0,d-1);if((ch===','||ch===';')&&!d){parts.push(c);c=''}else c+=ch}parts.push(c)});
  parts.forEach(s=>{
   s=s.replace(/…|\.\.\./g,'').replace(/\((several|[\d,\s–-]*)\)/gi,' ').replace(/\s+/g,' ').trim();
   if(!s||/^#{2,}/.test(s))return;
   const base=s.replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim(),m=base.match(/^(.*?)(\d+)\s*[–-]\s*(\d+)(.*)$/);
   if(m&&+m[3]>+m[2]&&+m[3]-+m[2]<=30){for(let n=+m[2];n<=+m[3];n++)items.push(mk((m[1]+n+m[4]).replace(/\s+/g,' ').trim()))}
   else items.push(mk(s));
  });
 }
 const seen=new Set();return items.filter(i=>{const k=i.name.toLowerCase();if(seen.has(k))return false;seen.add(k);return true});
}
const cur=r=>r.up?r.up:r.pick?r.pick:r.logo?{u:r.logo,n:'Logo from your playlist',s:'playlist'}:(r.cands[r.sel]?r.cands[r.sel].c:null);
function kind(r){
 if(r.up||r.logo||r.chosen||r.pick||r.accepted)return'ok';
 const t=r.cands[0];if(!t)return'none';
 return t.s>=.85?'ok':t.s>=.6?'review':'none';
}
const LBL={ok:'Matched',review:'Check this match',none:'No confident match'};
const ic=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`,KI={ok:'check',review:'alert',none:'x'};
let tab='all',sub='none',sf='all',GS=1,WO=false;
const hasImg=r=>!!cur(r)&&kind(r)!=='none';
const eff=r=>r.scale!=null?r.scale:(GS<1&&(!WO||(r.ar||0)>=2)?GS:1);
const A=(i,im)=>{const r=R[i];if(!r)return;r.ar=(im.naturalWidth/im.naturalHeight)||1;im.style.transform=`scale(${eff(r)})`};
function applyScales(){document.querySelectorAll('img[data-pv]').forEach(im=>{const r=R[+im.dataset.pv];if(r)im.style.transform=`scale(${eff(r)})`})}
function updSliders(){document.querySelectorAll('input[data-sc]').forEach(el=>{const v=Math.round(eff(R[+el.dataset.sc])*100);el.value=v;el.parentNode.querySelector('[data-scv]').textContent=v+'%'})}
function frameHtml(r,i,show,c){return show?`<div class="lg"><img data-pv="${i}" style="transform:scale(${eff(r)})" loading="lazy" referrerpolicy="no-referrer" src="${esc(c.u)}" alt="" onload="A(${i},this)" onerror="this.remove()"></div>`:`<div class="lg empty">${ic('image')}No logo yet</div>`}
function cardHtml(r,i,k){
 const c=cur(r);
 const sel=(!r.logo&&!r.up&&r.cands.length>1||(!r.logo&&!r.up&&k!=='ok'&&r.cands.length))?`<select data-i="${i}" aria-label="Choose logo">${(k==='none'&&!r.chosen?'<option value="-1">Pick a logo…</option>':'')}${r.cands.map((o,j)=>`<option value="${j}"${j===r.sel&&(k!=='none'||r.chosen)?' selected':''}>${esc(o.c.n)} (${o.c.s})</option>`).join('')}</select>`:'';
 const show=c&&(k!=='none'||r.chosen);
 const opts=r.deep&&r.deep.length&&!r.logo&&!r.up?'<div class="opts">'+r.deep.map((o,j)=>`<button class="op${r.pick&&r.pick.u===o.u?' on':''}" data-i="${i}" data-j="${j}" title="${esc(o.n+' ('+o.s+')')}"><img loading="lazy" referrerpolicy="no-referrer" src="${esc(o.u)}" alt="" onerror="this.parentNode.remove()">${o.t}</button>`).join('')+'</div>':'';
 const lab=r.up?'Your upload':r.chosen?'Your pick':r.accepted?'Confirmed match':LBL[k];
 return`<div class="c" data-i="${i}">${frameHtml(r,i,show,c)}<div class="n">${esc(r.name)}</div><div class="m k-${k}">${ic(KI[k])}<span>${lab}${show&&!r.logo?': '+esc(c.n):''}</span></div>${sel}${opts}${k==='review'?`<button class="acc" data-acc="${i}">${ic('check')}Confirm match</button>`:''}<button class="upb" data-up="${i}">${ic('up')}${show?'Replace logo':'Upload logo'}</button>${r.up?`<button class="rm" data-rm="${i}">${ic('trash')}Remove upload</button>`:''}${r.accepted&&!r.up&&!r.chosen&&!r.pick?`<button class="rm" data-undo="${i}">${ic('x')}Undo confirm</button>`:''}</div>`;
}
const tip=(i,t)=>`<p class="tip">${ic(i)}${t}</p>`;
function render(){
 const cnt={all:R.length,ok:0,review:0,none:0};R.forEach(r=>cnt[kind(r)]++);
 const need=R.filter(r=>r.need),todo=need.filter(r=>kind(r)!=='ok'),done=need.filter(r=>kind(r)==='ok');
 $('tabs').innerHTML=[['all','grid','All channels',R.length],['need','alert','Needs attention',todo.length],['scale','image','Scale',''] ].map(([t,i,l,n])=>`<button class="tab${tab===t?' on':''}" data-t="${t}">${ic(i)}${l}${n!==''?`<span>${n}</span>`:''}</button>`).join('');
 $('chips').style.display=tab==='all'?'flex':'none';
 $('chips').innerHTML=[['all','All'],['ok','Matched'],['review','Check'],['none','Missing']].map(([k,l])=>`<button class="chip${flt===k?' on':''}" data-f="${k}">${l} ${cnt[k]}</button>`).join('');
 $('zip').innerHTML=ic('down')+(tab==='need'?`Download updated ZIP (${done.length})`:'Download ZIP');
 let html='';
 if(tab==='need'){
  const none=todo.filter(r=>kind(r)==='none'),rev=todo.filter(r=>kind(r)==='review');
  const tot=need.length,pct=tot?Math.round(done.length/tot*100):0;
  html+=`<div class="tip stat"><div class="nums"><span><b>${done.length}</b>updated</span><span><b>${todo.length}</b>left to fix</span><span><b>${tot}</b>total</span></div><div class="pbar"><i style="width:${pct}%"></i></div></div>`;
  html+=`<div class="subs">${[['none','x','No confident match',none.length],['review','alert','Check this match',rev.length],['done','check','Updated',done.length]].map(([k,i,l,n])=>`<button class="sb${sub===k?' on':''}" data-s="${k}">${ic(i)}${l}<span>${n}</span></button>`).join('')}</div>`;
  const rows=sub==='none'?none:sub==='review'?rev:done;
  if(sub==='none'&&rows.length)html+=tip('up','No logo was found for these. Upload your own (PNG, JPG, SVG or WebP), drop an image onto the card, or pick a deep-search option.');
  if(sub==='review'&&rows.length)html+=tip('check','A logo was suggested for these. If it is right, tap the green Confirm match button. If not, choose another option or upload your own.');
  if(!rows.length)html+=sub==='none'?tip('check','No channels without a match are left.'):sub==='review'?tip('check','No matches left to check.'):tip('image','Nothing updated yet. Fixed channels will appear here.');
  html+=rows.map(r=>cardHtml(r,R.indexOf(r),kind(r))).join('');
 }else if(tab==='scale'){
  const all=R.map((r,i)=>({r,i})).filter(o=>hasImg(o.r));
  const nW=all.filter(o=>(o.r.ar||0)>=2).length,nA=all.filter(o=>o.r.scale!=null).length,gp=Math.round(GS*100);
  html+=`<div class="tip col"><b>Scale logos</b><p>Make logos sit smaller inside the frame. Wide logos benefit most. 100% is the normal size. The ZIP uses exactly what you see here.</p><div class="srow">${ic('image')}<input type="range" id="gs" min="40" max="100" step="5" value="${gp}" aria-label="Scale all logos"><span id="gsv">${gp}%</span></div><label class="chk"><input type="checkbox" id="wo"${WO?' checked':''}>Only apply to wide logos (2:1 or wider)</label><div><button class="fb" data-gsr="1">Reset all scaling</button></div></div>`;
  html+=`<div class="subs">${[['all','All',all.length],['wide','Wide',nW],['adj','Adjusted',nA]].map(([k,l,n])=>`<button class="chip${sf===k?' on':''}" data-sf="${k}">${l} ${n}</button>`).join('')}</div>`;
  const rows=all.filter(o=>sf==='all'||(sf==='wide'&&(o.r.ar||0)>=2)||(sf==='adj'&&o.r.scale!=null));
  if(!rows.length)html+=tip('image',all.length?'No logos in this view.':'No logos yet. Run a search first.');
  html+=rows.map(({r,i})=>{const v=Math.round(eff(r)*100);return`<div class="c" data-i="${i}">${frameHtml(r,i,true,cur(r))}<div class="n">${esc(r.name)}</div><div class="srow"><input type="range" data-sc="${i}" min="40" max="100" step="5" value="${v}" aria-label="Scale ${esc(r.name)}"><span data-scv="${i}">${v}%</span></div><button class="rm" data-scr="${i}">Reset</button></div>`}).join('');
 }else{
  html+=R.map((r,i)=>({r,i,k:kind(r)})).filter(o=>flt==='all'||o.k===flt).map(o=>cardHtml(o.r,o.i,o.k)).join('');
  if(!html)html=tip('image','Nothing to show here.');
 }
 $('grid').innerHTML=html;
}
async function probe(){
 const todo=R.filter(r=>hasImg(r)&&r.ar==null);if(!todo.length)return;
 let i=0;$('st').textContent='Measuring logos…';
 const w=async()=>{while(i<todo.length){const r=todo[i++];await new Promise(res=>{const im=new Image();im.onload=()=>{r.ar=(im.naturalWidth/im.naturalHeight)||1;res()};im.onerror=()=>{r.ar=1;res()};im.src=cur(r).u})}};
 await Promise.all(Array.from({length:8},w));
 $('st').textContent='';if(tab==='scale')render();
}
$('run').onclick=async()=>{
 const items=parseList($('in').value);
 if(!items.length){$('st').textContent='Add some channel names first.';return}
 try{await loadDB()}catch(e){$('st').textContent=e.message;return}
 $('st').textContent='Matching '+items.length+' channels…';
 await new Promise(r=>setTimeout(r,30));
 R=items.map(it=>({...it,cands:it.logo?[]:find(P(it.q)),sel:0,chosen:false}));
 R.forEach(r=>r.need=kind(r)!=='ok');
 const k={ok:0,review:0,none:0};R.forEach(r=>k[kind(r)]++);
 $('st').textContent=`${R.length} channels: ${k.ok} matched, ${k.review} to check, ${k.none} without a confident match.`;
 $('bar').style.display='block';flt='all';tab='all';sub='none';sf='all';render();
};
$('f').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>{$('in').value=t;$('run').click()})};
$('chips').onclick=e=>{const b=e.target.closest('[data-f]');if(b){flt=b.dataset.f;render()}};
$('grid').onchange=e=>{const s=e.target.closest('select');if(!s)return;const v=+s.value;if(v<0)return;const r=R[s.dataset.i];r.sel=v;r.pick=null;r.chosen=true;render()};

const loadImg=u=>new Promise((res,rej)=>{const im=new Image();im.crossOrigin='anonymous';im.referrerPolicy='no-referrer';im.onload=()=>res(im);im.onerror=()=>rej();im.src=u});
async function toPng(u,w,h,r){
 let im;try{im=await loadImg(u)}catch{im=await loadImg('https://wsrv.nl/?output=png&url='+encodeURIComponent(u))}
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 if($('bg').checked){x.fillStyle='#fff';x.fillRect(0,0,w,h)}
 const iw=im.naturalWidth||300,ih=im.naturalHeight||150,pad=Math.round(w*.08),s=Math.min((w-2*pad)/iw,(h-2*pad)/ih)*(r&&r.scale!=null?r.scale:(GS<1&&(!WO||iw/ih>=2)?GS:1));
 x.imageSmoothingQuality='high';x.drawImage(im,(w-iw*s)/2,(h-ih*s)/2,iw*s,ih*s);
 return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(),'image/png'));
}
$('grid').addEventListener('input',e=>{const t=e.target;
 if(t.id==='gs'){GS=t.value/100;$('gsv').textContent=t.value+'%';applyScales();updSliders()}
 else if(t.dataset&&t.dataset.sc!==undefined){R[+t.dataset.sc].scale=t.value/100;t.parentNode.querySelector('[data-scv]').textContent=t.value+'%';applyScales()}
});
$('grid').addEventListener('change',e=>{if(e.target.id==='wo'){WO=e.target.checked;applyScales();updSliders()}});
let upIdx=-1;
function setUpload(i,f){
 if(!f)return;
 if(!/^image\//.test(f.type)){$('st').textContent='That file is not an image. Use PNG, JPG, SVG or WebP.';return}
 const r=R[i];if(r.up)URL.revokeObjectURL(r.up.u);
 r.up={u:URL.createObjectURL(f),n:f.name,s:'upload'};r.pick=null;r.touched=true;render();
 const left=R.filter(x=>x.need&&kind(x)!=='ok').length;$('st').textContent='Added your image for '+r.name+'.'+(r.need?' '+left+' left to fix.':'');
}
$('upf').onchange=e=>{setUpload(upIdx,e.target.files[0]);e.target.value=''};
$('tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;render();if(tab==='scale')probe()}};
$('grid').addEventListener('dragover',e=>{const c=e.target.closest('.c');if(c){e.preventDefault();c.classList.add('drag')}});
$('grid').addEventListener('dragleave',e=>{const c=e.target.closest('.c');if(c)c.classList.remove('drag')});
$('grid').addEventListener('drop',e=>{const c=e.target.closest('.c');if(!c)return;e.preventDefault();c.classList.remove('drag');setUpload(+c.dataset.i,e.dataTransfer.files[0])});
$('grid').onclick=e=>{
 const u=e.target.closest('[data-up]');if(u){upIdx=+u.dataset.up;$('upf').click();return}
 const ac=e.target.closest('[data-acc]');if(ac){const r=R[+ac.dataset.acc];r.accepted=true;render();$('st').textContent='Confirmed '+r.name+'. '+R.filter(x=>x.need&&kind(x)!=='ok').length+' left to fix.';return}
 const un=e.target.closest('[data-undo]');if(un){R[+un.dataset.undo].accepted=false;render();return}
 const sb=e.target.closest('[data-s]');if(sb){sub=sb.dataset.s;render();return}
 const sfb=e.target.closest('[data-sf]');if(sfb){sf=sfb.dataset.sf;render();return}
 const gr=e.target.closest('[data-gsr]');if(gr){GS=1;WO=false;R.forEach(r=>{delete r.scale});render();return}
 const sr=e.target.closest('[data-scr]');if(sr){delete R[+sr.dataset.scr].scale;applyScales();updSliders();return}
 const m=e.target.closest('[data-rm]');if(m){const r=R[+m.dataset.rm];URL.revokeObjectURL(r.up.u);r.up=null;render();return}
 const b=e.target.closest('.op');if(!b)return;const r=R[b.dataset.i],o=r.deep[b.dataset.j];if(r.pick&&r.pick.u===o.u){r.pick=null;r.chosen=false}else{r.pick={u:o.u,n:o.n,s:o.s};r.chosen=true}render()};
const tier=x=>x>=.85?'Known':x>=.6?'Close':'Possible';
async function wiki(q){
 const j=await fetch('https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrlimit=8&format=json&origin=*&prop=imageinfo&iiprop=url&iiurlwidth=600&gsrsearch='+encodeURIComponent(q+' logo')).then(r=>r.json());
 const qt=new Set([...P(q).t,'logo']);
 return Object.values((j.query||{}).pages||{}).filter(p=>p.imageinfo&&/\.(png|svg|jpe?g|webp)$/i.test(p.title)).map(p=>{const n=p.title.replace(/^File:/,'').replace(/\.\w+$/,''),t=P(n).t;let sh=0;t.forEach(x=>qt.has(x)&&sh++);return{u:p.imageinfo[0].thumburl||p.imageinfo[0].url,n,sc:2*sh/((t.length+qt.size)||1)}}).sort((a,b)=>b.sc-a.sc).slice(0,6);
}
$('deep').onclick=async()=>{
 const miss=R.filter(r=>!r.logo&&kind(r)!=='ok');
 if(!miss.length){$('st').textContent='Nothing is missing. Every channel already has a logo.';return}
 let i=0,done=0,found=0;
 const work=async()=>{while(i<miss.length){
  const r=miss[i++],seen=new Set(),opts=[];
  find(P(r.q),.12,8).forEach(o=>{if(!seen.has(o.c.u)){seen.add(o.c.u);opts.push({u:o.c.u,n:o.c.n,s:o.c.s,t:tier(o.s)})}});
  try{(await wiki(r.q)).forEach(w=>{if(!seen.has(w.u)){seen.add(w.u);opts.push({u:w.u,n:w.n,s:'wikimedia',t:'Wiki'})}})}catch{}
  r.deep=opts;if(opts.length)found++;
  $('st').textContent=`Deep search ${++done} of ${miss.length}…`;
 }};
 await Promise.all(Array.from({length:4},work));
 flt='none';tab='need';R.forEach(r=>{if(kind(r)!=='ok')r.touched=true});render();
 $('st').textContent=`Found options for ${found} of ${miss.length} missing channels. Tap a logo under a channel to choose it (tap again to undo). Labels: Known and Close are strong name matches, Possible is a loose guess, Wiki is from Wikimedia Commons.`;
 $('grid').scrollIntoView({behavior:'smooth'});
};
const CCN={US:'United States',GB:'United Kingdom',FR:'France',DE:'Germany',IT:'Italy',ES:'Spain',PT:'Portugal',PL:'Poland',NL:'Netherlands',DK:'Denmark',SE:'Sweden',NO:'Norway',TR:'Turkey',GR:'Greece',CY:'Cyprus',IL:'Israel',RU:'Russia',RS:'Serbia',HR:'Croatia',BG:'Bulgaria',RO:'Romania',CZ:'Czechia',SK:'Slovakia',CA:'Canada',MX:'Mexico',BR:'Brazil',AR:'Argentina',AE:'UAE',QA:'Qatar',AU:'Australia',NZ:'New Zealand',IN:'India',PK:'Pakistan',BD:'Bangladesh',HU:'Hungary',IE:'Ireland',BA:'Bosnia',MY:'Malaysia',CL:'Chile',UY:'Uruguay',CO:'Colombia',AT:'Austria',CH:'Switzerland',BE:'Belgium',ZA:'South Africa'};
$('zip').onclick=async()=>{
 const upd=tab==='need';
 const list=R.map(r=>({r,c:cur(r),k:kind(r)})).filter(o=>o.c&&(upd?(o.r.need&&o.k==='ok'):(o.k==='ok'||o.k==='review')));
 if(!list.length){$('st').textContent=upd?'Nothing updated yet. Upload or pick a logo for a channel on the To fix list first.':'No logos to download yet.';return}
 if(!window.JSZip){$('st').textContent='ZIP library could not load. Check your internet connection.';return}
 $('done').innerHTML='';
 const [w,h]=$('sz').value.split('x').map(Number),z=new JSZip(),man=[['channel','file','matched_name','source','logo_url']],skipped=[];let done=0,i=0,added=0;
 const q=s=>'"'+String(s).replace(/"/g,'""')+'"',used=new Set();
 const work=async()=>{while(i<list.length){
  const o=list[i++],r=o.r;
  const urls=[o.c.u,...(r.logo||r.pick||r.up?[]:r.cands.filter((x,j)=>j!==r.sel&&x.s>=.85&&x.c.u!==o.c.u).map(x=>x.c.u))];
  let b=null,used_u=o.c.u;
  for(const u of urls){try{b=await toPng(u,w,h,r);used_u=u;break}catch{}}
  if(b){
   const folder=CCN[P(r.q).cc||o.c.cc]||'Other';
   const base=r.name.replace(/[\\/:*?"<>|]/g,'-').replace(/[. ]+$/,'')||'channel';let fn=base,k=1;
   while(used.has((folder+'/'+fn).toLowerCase()))fn=base+' ('+(++k)+')';used.add((folder+'/'+fn).toLowerCase());
   z.file(folder+'/'+fn+'.png',b);man.push([r.name,folder+'/'+fn+'.png',o.c.n,o.c.s,o.c.s==='upload'?'(your upload)':used_u]);added++;
  }else skipped.push(r.name);
  $('st').textContent=`Rendering ${++done} of ${list.length}…`;
 }};
 await Promise.all(Array.from({length:6},work));
 (upd?R.filter(r=>r.need):R).filter(r=>!list.some(o=>o.r===r)).forEach(r=>skipped.push(r.name));
 if(!added){$('st').textContent='No logo images could be downloaded. Check your connection and try again.';return}
 z.file('manifest.csv',man.map(r=>r.map(q).join(',')).join('\n'));
 $('st').textContent='Building ZIP…';
 const blob=await z.generateAsync({type:'blob',compression:'STORE'}),name=`CHQ-${upd?'updated-':''}logos-${w}x${h}.zip`,url=URL.createObjectURL(blob);
 const f=new File([blob],name,{type:'application/zip'}),canShare=!!(navigator.canShare&&navigator.canShare({files:[f]}));
 $('st').textContent='';
 $('done').innerHTML=`<div class="box"><b>${added} ${upd?'updated ':''}logos ready</b> in ${w}×${h}, sorted into folders by country. Only channels with an image are included.<div class="row"><a class="fb go" href="${url}" download="${esc(name)}">${ic('down')}Save ZIP</a>${canShare?`<button id="sh" class="fb">${ic('share')}Share ZIP</button>`:''}</div>${skipped.length?`<details><summary>${skipped.length} channels ${upd?'still to fix':'left out (no image)'}</summary><p class="m">${esc(skipped.join(', '))}</p></details>`:''}</div>`;
 if(canShare)$('sh').onclick=()=>navigator.share({files:[f],title:name}).catch(()=>{});
 $('done').scrollIntoView({behavior:'smooth',block:'center'});
};
</script></body></html>
